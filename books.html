<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Damien Lefebvre</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <style>
        .page-intro {
            width: 100%;
            margin: 0 0 3.5rem;
            animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .page-intro h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .trilogy-blurb p {
            font-size: 1.05rem;
            line-height: 1.75;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .trilogy-blurb p + p {
            margin-top: 0.75rem;
        }

        .trilogy-blurb a {
            color: var(--text-secondary);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.18em;
            transition: color 0.3s ease;
        }

        .trilogy-blurb a:hover {
            color: var(--accent);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5rem 1.75rem;
            margin-bottom: 2rem;
            animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        .book {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .book-cover-link {
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(160deg, #2a2a26 0%, #3d3d36 100%);
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
            display: block;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
        }

        .book:hover .book-cover {
            transform: translateY(-4px);
        }

        .book-cover.coming-soon-cover {
            background: linear-gradient(160deg, var(--coming-soon-color-1) 0%, var(--coming-soon-color-2) 100%);
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .coming-soon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .book-info {
            text-align: left;
            width: 100%;
        }

        .book-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 400;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .book-title-link {
            text-decoration: none;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .book-title-link:hover {
            color: var(--accent);
        }

        .book-year {
            font-size: 0.8rem;
            color: var(--text-quaternary);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        @media (max-width: 900px) {
            .trilogy-blurb p {
                white-space: normal;
            }

            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2.5rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .books-grid {
                grid-template-columns: 1fr 1fr;
                gap: 2rem 1rem;
            }

            .book-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div class="container">
        <section>
            <div class="page-intro">
                <h1>Books</h1>
                <div class="trilogy-blurb" id="trilogy-blurb"></div>
            </div>
            <div class="books-grid" id="books-grid"></div>
        </section>

        <footer>
            <div id="footer-social-placeholder"></div>
            <p>&copy; <span id="copyright-year"></span></p>
        </footer>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/background-interactive.js"></script>
    <script src="js/header-content.js"></script>
    <script src="js/load-header.js"></script>
    <script src="js/content.js"></script>
    <script src="js/load-content.js"></script>
    <script src="js/load-footer.js"></script>
    <script>
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
