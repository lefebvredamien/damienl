<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Damien Lefebvre</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <style>


        .section-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 3rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-align: center;
        }

        .trilogy-blurb {
            max-width: 1200px;
            margin: 0 auto 4rem;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .trilogy-blurb p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            text-align: center;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 3rem;
            margin-bottom: 4rem;
        }

        .book-new-row {
            grid-column: 1;
        }

        .book {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .book:hover {
            transform: translateY(-8px);
        }

        .book-cover-link {
            text-decoration: none;
            display: block;
            width: 100%;
            max-width: 300px;
        }

        .book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
            position: relative;
            cursor: pointer;
            display: block;
        }

        .book-cover.coming-soon-cover {
            background: linear-gradient(135deg, var(--coming-soon-color-1) 0%, var(--coming-soon-color-2) 100%);
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .coming-soon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .book-cover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            pointer-events: none;
        }

        .book-info {
            text-align: center;
        }

        .book-title {
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .book-title-link {
            text-decoration: none;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .book-title-link:hover {
            color: var(--text-primary);
        }

        .book-year {
            font-size: 0.85rem;
            color: var(--text-quaternary);
            font-weight: 300;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {

            .trilogy-blurb {
                padding: 1.5rem;
                margin-bottom: 3rem;
            }

            .trilogy-blurb p {
                font-size: 1rem;
            }

            .books-grid {
                grid-template-columns: 1fr;
                gap: 4rem;
            }

            .book-cover {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div class="container">

        <section>
            <div class="trilogy-blurb" id="trilogy-blurb"></div>
            <div class="books-grid" id="books-grid"></div>
        </section>

        <footer>
            <div id="footer-social-placeholder"></div>
            <p>&copy; <span id="copyright-year"></span></p>
        </footer>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/background-interactive.js"></script>
    <script src="js/header-content.js"></script>
    <script src="js/load-header.js"></script>
    <script src="js/content.js"></script>
    <script src="js/load-content.js"></script>
    <script src="js/load-footer.js"></script>
    <script>
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
