<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damien Lefebvre</title>
    <meta name="description" content="Stories and yearly predictions.">
    <link rel="canonical" href="https://damienl.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Damien Lefebvre">
    <meta property="og:title" content="Damien Lefebvre">
    <meta property="og:description" content="Stories and yearly predictions.">
    <meta property="og:url" content="https://damienl.com/">
    <meta property="og:image" content="https://damienl.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Damien Lefebvre">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Damien Lefebvre">
    <meta name="twitter:description" content="Stories and yearly predictions.">
    <meta name="twitter:image" content="https://damienl.com/og-image.jpg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/footer.css">
    <style>
        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: none;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        #home {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
            margin: 0;
        }

        .cities-stage {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .city-panel {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            min-height: 0;
            cursor: default;
        }

        .city-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 28%,
                rgba(0, 0, 0, 0.35) 62%,
                rgba(0, 0, 0, 0.72) 100%
            );
        }

        .city-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scale(1);
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
            filter: brightness(0.95);
        }

        .city-panel:hover img {
            transform: scale(1.12);
        }

        .city-meta {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            text-align: center;
            padding: 1.25rem;
            opacity: 1;
            pointer-events: none;
            z-index: 2;
        }

        .city-name {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 2.8vw, 2.1rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #f2f1ec;
            margin-bottom: 0.4rem;
        }

        .city-years {
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(242, 241, 236, 0.75);
        }

        .profile-center {
            position: absolute;
            left: 0;
            right: 0;
            top: 25%;
            margin: 0 auto;
            translate: 0 -50%;
            z-index: 5;
            width: clamp(120px, 15vw, 180px);
            height: clamp(120px, 15vw, 180px);
            pointer-events: none;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .profile-orb {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: visible;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            background: var(--bg-secondary);
            pointer-events: auto;
            cursor: default;
        }

        .profile-orb::before {
            content: "";
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 300deg,
                rgba(0, 0, 0, 0.4) 325deg,
                #000 345deg,
                transparent 360deg
            );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .profile-orb:hover::before {
            animation: orbit-arc-once 0.7s ease-out forwards;
        }

        @keyframes orbit-arc-once {
            0% {
                opacity: 1;
                transform: rotate(0deg);
            }
            92% {
                opacity: 1;
                transform: rotate(360deg);
            }
            100% {
                opacity: 0;
                transform: rotate(360deg);
            }
        }

        .profile-orb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .home-identity {
            position: absolute;
            top: calc(100% + 1rem);
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: calc(100vw - 2rem);
            text-align: center;
            pointer-events: auto;
            padding: 0.85rem 1.35rem 1rem;
            background: rgba(0, 0, 0, 0.62);
            border-radius: 10px;
        }

        .home-brand {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 2.5vw, 1.85rem);
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: #f2f1ec;
            margin: 0;
            text-align: center;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
        }

        .home-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.85rem 1.5rem;
            margin-top: 0.85rem;
        }

        .home-links a,
        .home-links button {
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            color: rgba(242, 241, 236, 0.7);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
            transition: color 0.3s ease;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .home-links a:hover,
        .home-links button:hover,
        .home-links button[aria-expanded="true"] {
            color: #f2f1ec;
        }

        .home-social {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 0.85rem;
            padding-top: 0.9rem;
        }

        .home-social.is-open {
            display: flex;
            animation: home-social-in 0.35s var(--ease) both;
        }

        @keyframes home-social-in {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .home-social .contact-link {
            position: relative;
            color: rgba(242, 241, 236, 0.7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.15rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .home-social .contact-link:hover {
            color: #f2f1ec;
        }

        .home-social .contact-link svg {
            display: block;
            width: 16px;
            height: 16px;
        }

        .home-social span.contact-link {
            cursor: pointer;
        }

        .home-social span.contact-link::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            margin-bottom: 0.4rem;
            padding: 0.4rem 0.65rem;
            background: rgba(0, 0, 0, 0.88);
            border: 1px solid rgba(242, 241, 236, 0.16);
            border-radius: 4px;
            color: #f2f1ec;
            font-family: var(--font-body);
            font-size: 0.7rem;
            letter-spacing: 0;
            text-transform: none;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease, transform 0.25s ease;
            z-index: 5;
        }

        .home-social span.contact-link:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .home-footer-wrap {
            display: none;
        }

        @media (max-width: 768px) {
            .profile-center {
                width: 100px;
                height: 100px;
            }

            .home-brand {
                font-size: 1.25rem;
            }

            .home-links {
                gap: 1.15rem;
                margin-top: 0.7rem;
            }

            .home-links a,
            .home-links button {
                font-size: 0.7rem;
            }

            .city-name {
                font-size: clamp(0.95rem, 3.5vw, 1.25rem);
            }

            .city-years {
                font-size: 0.65rem;
                letter-spacing: 0.08em;
            }

            .city-meta {
                padding: 0.75rem 0.5rem;
            }

            .city-panel:hover img {
                transform: scale(1.08);
            }
        }

        .home-panel[hidden],
        .home-panel-view[hidden] {
            display: none !important;
        }

        .home-panel {
            --text-primary: #f2f1ec;
            --text-secondary: rgba(242, 241, 236, 0.72);
            --text-tertiary: rgba(242, 241, 236, 0.5);
            --text-quaternary: rgba(242, 241, 236, 0.35);
            --accent: #9aab8e;
            --coming-soon-color-1: #2a2a26;
            --coming-soon-color-2: #3a3a34;
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #f2f1ec;
        }

        .home-panel-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .home-panel-sheet {
            position: relative;
            width: min(1100px, 100%);
            max-height: min(88dvh, 920px);
            overflow: auto;
            overscroll-behavior: contain;
            background: rgba(17, 17, 16, 0.92);
            border: 1px solid rgba(242, 241, 236, 0.12);
            border-radius: 14px;
            padding: 1.15rem 2.25rem 2rem;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            animation: rise 0.45s var(--ease) both;
        }

        .home-panel-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1.25rem;
            position: sticky;
            top: 0;
            z-index: 2;
            margin: -1.15rem -2.25rem 0.25rem;
            padding: 0.85rem 1.15rem 0.65rem;
            background: linear-gradient(to bottom, rgba(17, 17, 16, 0.98) 55%, rgba(17, 17, 16, 0));
        }

        .home-panel-close,
        .home-panel-back {
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(242, 241, 236, 0.7);
            background: none;
            border: none;
            padding: 0.2rem 0.15rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .home-panel-back[hidden] {
            display: none !important;
        }

        .home-panel-close:hover,
        .home-panel-back:hover {
            color: #f2f1ec;
        }

        .home-panel .page-intro {
            margin: 0 0 2rem;
        }

        .home-panel .page-intro h2 {
            font-family: var(--font-display);
            font-size: clamp(1.75rem, 3vw, 2.4rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 0.85rem;
            color: var(--text-primary);
        }

        .home-panel .trilogy-blurb p,
        .home-panel .predictions-blurb p {
            font-size: 1.02rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .home-panel .trilogy-blurb p + p,
        .home-panel .predictions-blurb p + p {
            margin-top: 0.65rem;
        }

        .home-panel .predictions-blurb {
            max-width: 36rem;
        }

        .home-panel .trilogy-blurb a {
            color: var(--text-secondary);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.18em;
            transition: color 0.3s ease;
        }

        .home-panel .trilogy-blurb a:hover {
            color: var(--accent);
        }

        .home-panel .books-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem 1.5rem;
        }

        .home-panel .book,
        .home-panel .prediction {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .home-panel .book-cover-link {
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .home-panel .book-cover,
        .home-panel .prediction-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(160deg, #2a2a26 0%, #3d3d36 100%);
            overflow: hidden;
            margin-bottom: 0.85rem;
            position: relative;
            display: block;
            transition: transform 0.45s var(--ease);
        }

        .home-panel .prediction-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--coming-soon-color-1) 0%, var(--coming-soon-color-2) 100%);
        }

        .home-panel .book:hover .book-cover,
        .home-panel .prediction:hover .prediction-cover {
            transform: translateY(-4px);
        }

        .home-panel .book-cover img,
        .home-panel .prediction-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .home-panel .coming-soon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .home-panel .book-info,
        .home-panel .prediction-info {
            text-align: left;
            width: 100%;
        }

        .home-panel .book-title,
        .home-panel .prediction-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 400;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .home-panel .prediction-title {
            font-size: 1.2rem;
        }

        .home-panel .book-title-link {
            text-decoration: none;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .home-panel .book-title-link:hover {
            color: var(--accent);
        }

        .home-panel .book-year,
        .home-panel .prediction-year {
            font-size: 0.8rem;
            color: var(--text-quaternary);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        .home-panel .predictions-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 240px));
            gap: 2rem 1.5rem;
        }

        @media (max-width: 900px) {
            .home-panel .books-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .home-panel {
                padding: 0.65rem;
            }

            .home-panel-sheet {
                max-height: calc(100dvh - 1.3rem);
                padding: 0.9rem 1.1rem 1.25rem;
                border-radius: 12px;
            }

            .home-panel-bar {
                margin: -0.9rem -1.1rem 0.15rem;
                padding: 0.7rem 0.9rem 0.45rem;
            }

            .home-panel .predictions-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section id="home">
            <div class="cities-stage" id="cities-stage">
                <div class="profile-center">
                    <div class="profile-orb">
                        <img data-content="author-photo" alt="">
                    </div>
                    <div class="home-identity">
                        <h1 class="home-brand" data-content="author-name">Damien Lefebvre</h1>
                        <nav class="home-links">
                            <button type="button" data-open-panel="books" aria-expanded="false" aria-controls="home-panel">Books</button>
                            <button type="button" id="home-social-toggle" aria-expanded="false" aria-controls="home-social">Social</button>
                        </nav>
                        <div class="home-social" id="home-social"></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="home-footer-wrap">
            <footer>
                <div id="footer-social-placeholder"></div>
                <p>&copy; <span id="copyright-year"></span></p>
            </footer>
        </div>
    </div>
    <div class="home-panel" id="home-panel" hidden>
        <div class="home-panel-backdrop" data-close-panel></div>
        <div class="home-panel-sheet" id="home-panel-sheet" role="dialog" aria-modal="true">
            <div class="home-panel-bar">
                <button type="button" class="home-panel-back" data-panel-back hidden>Back</button>
                <button type="button" class="home-panel-close" data-close-panel>Close</button>
            </div>
            <div class="home-panel-view" id="home-panel-books" hidden>
                <div class="page-intro">
                    <h2 id="home-panel-books-title">Books</h2>
                    <div class="trilogy-blurb" id="trilogy-blurb"></div>
                </div>
                <div class="books-grid" id="books-grid"></div>
            </div>
            <div class="home-panel-view" id="home-panel-predictions" hidden>
                <div class="page-intro">
                    <h2 id="home-panel-predictions-title">Predictions</h2>
                    <div class="predictions-blurb" id="predictions-blurb"></div>
                </div>
                <div class="predictions-grid" id="predictions-grid"></div>
            </div>
        </div>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/background-interactive.js"></script>
    <script src="js/content.js"></script>
    <script src="js/load-content.js"></script>
    <script src="js/load-footer.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('home-social-toggle');
            const panel = document.getElementById('home-social');
            if (!toggle || !panel) return;

            const hoverFine = window.matchMedia('(hover: hover) and (pointer: fine)');
            let closeTimer;

            function setOpen(open) {
                clearTimeout(closeTimer);
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                panel.classList.toggle('is-open', open);
            }

            function scheduleClose() {
                clearTimeout(closeTimer);
                closeTimer = setTimeout(function() {
                    toggle.setAttribute('aria-expanded', 'false');
                    panel.classList.remove('is-open');
                }, 180);
            }

            if (hoverFine.matches) {
                toggle.addEventListener('mouseenter', function() { setOpen(true); });
                panel.addEventListener('mouseenter', function() { setOpen(true); });
                toggle.addEventListener('mouseleave', scheduleClose);
                panel.addEventListener('mouseleave', scheduleClose);
                toggle.addEventListener('focus', function() { setOpen(true); });
                toggle.addEventListener('blur', scheduleClose);
                panel.addEventListener('focusin', function() { setOpen(true); });
                panel.addEventListener('focusout', scheduleClose);
            } else {
                toggle.addEventListener('click', function() {
                    setOpen(toggle.getAttribute('aria-expanded') !== 'true');
                });
            }
        })();

        (function() {
            const panel = document.getElementById('home-panel');
            const sheet = document.getElementById('home-panel-sheet');
            const views = {
                books: document.getElementById('home-panel-books'),
                predictions: document.getElementById('home-panel-predictions')
            };
            const triggers = document.querySelectorAll('[data-open-panel]');
            let lastTrigger = null;
            let active = null;

            function setExpanded(name) {
                triggers.forEach(function(btn) {
                    btn.setAttribute('aria-expanded', btn.getAttribute('data-open-panel') === name ? 'true' : 'false');
                });
            }

            function show(name) {
                if (!views[name]) return;
                Object.keys(views).forEach(function(key) {
                    views[key].hidden = key !== name;
                });
                const title = views[name].querySelector('h2');
                if (title) sheet.setAttribute('aria-labelledby', title.id);
                const backBtn = sheet.querySelector('[data-panel-back]');
                if (backBtn) backBtn.hidden = name !== 'predictions';
                const socialToggle = document.getElementById('home-social-toggle');
                const socialPanel = document.getElementById('home-social');
                if (socialToggle && socialPanel) {
                    socialToggle.setAttribute('aria-expanded', 'false');
                    socialPanel.classList.remove('is-open');
                }
                panel.hidden = false;
                active = name;
                setExpanded(name);
                const closeBtn = sheet.querySelector('.home-panel-close');
                if (closeBtn) closeBtn.focus();
            }

            function hide() {
                if (panel.hidden) return;
                panel.hidden = true;
                active = null;
                setExpanded('');
                if (lastTrigger) lastTrigger.focus();
            }

            function open(name, trigger) {
                if (trigger) lastTrigger = trigger;
                if (location.hash !== '#' + name) {
                    history.pushState({ panel: name }, '', '#' + name);
                }
                show(name);
            }

            function close() {
                if (location.hash === '#books' || location.hash === '#predictions') {
                    history.pushState(null, '', location.pathname + location.search);
                }
                hide();
            }

            function sync() {
                const hash = location.hash.slice(1);
                if (hash === 'books' || hash === 'predictions') {
                    if (!lastTrigger) {
                        lastTrigger = document.querySelector('[data-open-panel="' + hash + '"]');
                    }
                    show(hash);
                } else if (active) {
                    hide();
                }
            }

            triggers.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const name = btn.getAttribute('data-open-panel');
                    if (active === name) close();
                    else open(name, btn);
                });
            });

            panel.addEventListener('click', function(e) {
                if (e.target.closest('[data-panel-back]')) {
                    open('books');
                    return;
                }
                if (e.target.closest('[data-close-panel]')) close();
            });

            document.addEventListener('keydown', function(e) {
                if (panel.hidden) return;
                if (e.key === 'Escape') {
                    e.preventDefault();
                    close();
                    return;
                }
                if (e.key !== 'Tab' || !active) return;
                const closeBtn = sheet.querySelector('.home-panel-close');
                const backBtn = sheet.querySelector('[data-panel-back]');
                const focusable = [];
                if (backBtn && !backBtn.hidden) focusable.push(backBtn);
                focusable.push(closeBtn);
                focusable.push.apply(focusable, Array.from(views[active].querySelectorAll('a[href], button:not([disabled])')));
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (!first || !last) return;
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            });

            window.addEventListener('hashchange', sync);
            window.addEventListener('popstate', sync);
            sync();
        })();
    </script>
</body>
</html>
