<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damien Lefebvre</title>
    <meta name="description" content="Stories and yearly predictions.">
    <link rel="canonical" href="https://damienl.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Damien Lefebvre">
    <meta property="og:title" content="Damien Lefebvre">
    <meta property="og:description" content="Stories and yearly predictions.">
    <meta property="og:url" content="https://damienl.com/">
    <meta property="og:image" content="https://damienl.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Damien Lefebvre">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Damien Lefebvre">
    <meta name="twitter:description" content="Stories and yearly predictions.">
    <meta name="twitter:image" content="https://damienl.com/og-image.jpg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/footer.css">
    <style>
        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: none;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        #home {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
            margin: 0;
        }

        .cities-stage {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .city-panel {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            min-height: 0;
            cursor: default;
        }

        .city-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 28%,
                rgba(0, 0, 0, 0.35) 62%,
                rgba(0, 0, 0, 0.72) 100%
            );
        }

        .city-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scale(1);
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
            filter: brightness(0.95);
        }

        .city-panel:hover img {
            transform: scale(1.12);
        }

        .city-meta {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            text-align: center;
            padding: 1.25rem;
            opacity: 1;
            pointer-events: none;
            z-index: 2;
        }

        .city-name {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 2.8vw, 2.1rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #f2f1ec;
            margin-bottom: 0.4rem;
        }

        .city-years {
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(242, 241, 236, 0.75);
        }

        .profile-center {
            position: absolute;
            left: 0;
            right: 0;
            top: 25%;
            margin: 0 auto;
            translate: 0 -50%;
            z-index: 5;
            width: clamp(120px, 15vw, 180px);
            height: clamp(120px, 15vw, 180px);
            pointer-events: none;
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .profile-orb {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: visible;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            background: var(--bg-secondary);
            pointer-events: auto;
            cursor: default;
        }

        .profile-orb::before {
            content: "";
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 300deg,
                rgba(0, 0, 0, 0.4) 325deg,
                #000 345deg,
                transparent 360deg
            );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .profile-orb:hover::before {
            animation: orbit-arc-once 0.7s ease-out forwards;
        }

        @keyframes orbit-arc-once {
            0% {
                opacity: 1;
                transform: rotate(0deg);
            }
            92% {
                opacity: 1;
                transform: rotate(360deg);
            }
            100% {
                opacity: 0;
                transform: rotate(360deg);
            }
        }

        .profile-orb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .home-identity {
            position: absolute;
            top: calc(100% + 1rem);
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            text-align: center;
            pointer-events: auto;
            padding: 0.85rem 1.35rem 1rem;
            background: rgba(0, 0, 0, 0.62);
            border-radius: 10px;
        }

        .home-brand {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 2.5vw, 1.85rem);
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: #f2f1ec;
            margin: 0;
            text-align: center;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
        }

        .home-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 0.85rem;
        }

        .home-links a {
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            color: rgba(242, 241, 236, 0.7);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
            transition: color 0.3s ease;
        }

        .home-links a:hover {
            color: #f2f1ec;
        }

        .home-footer-wrap {
            display: none;
        }

        @media (max-width: 768px) {
            .profile-center {
                width: 100px;
                height: 100px;
            }

            .home-brand {
                font-size: 1.25rem;
            }

            .home-links {
                gap: 1.15rem;
                margin-top: 0.7rem;
            }

            .home-links a {
                font-size: 0.7rem;
            }

            .city-name {
                font-size: clamp(0.95rem, 3.5vw, 1.25rem);
            }

            .city-years {
                font-size: 0.65rem;
                letter-spacing: 0.08em;
            }

            .city-meta {
                padding: 0.75rem 0.5rem;
            }

            .city-panel:hover img {
                transform: scale(1.08);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section id="home">
            <div class="cities-stage" id="cities-stage">
                <div class="profile-center">
                    <div class="profile-orb">
                        <img data-content="author-photo" alt="">
                    </div>
                    <div class="home-identity">
                        <h1 class="home-brand" data-content="author-name">Damien Lefebvre</h1>
                        <nav class="home-links">
                            <a href="books.html">Books</a>
                            <a href="predictions.html">Predictions</a>
                        </nav>
                    </div>
                </div>
            </div>
        </section>

        <div class="home-footer-wrap">
            <footer>
                <div id="footer-social-placeholder"></div>
                <p>&copy; <span id="copyright-year"></span></p>
            </footer>
        </div>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/background-interactive.js"></script>
    <script src="js/content.js"></script>
    <script src="js/load-content.js"></script>
    <script src="js/load-footer.js"></script>
</body>
</html>
