<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damien Lefebvre</title>
    <meta name="description" content="Stories and yearly predictions.">
    <link rel="canonical" href="https://damienl.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Damien Lefebvre">
    <meta property="og:title" content="Damien Lefebvre">
    <meta property="og:description" content="Stories and yearly predictions.">
    <meta property="og:url" content="https://damienl.com/">
    <meta property="og:image" content="https://damienl.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Damien Lefebvre">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Damien Lefebvre">
    <meta name="twitter:description" content="Stories and yearly predictions.">
    <meta name="twitter:image" content="https://damienl.com/og-image.jpg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <section id="home">
            <div class="cities-stage" id="cities-stage">
                <div class="profile-center">
                    <div class="profile-orb">
                        <img data-content="author-photo" alt="">
                    </div>
                    <div class="home-identity">
                        <h1 class="home-brand" data-content="author-name">Damien Lefebvre</h1>
                        <nav class="home-links">
                            <button type="button" data-open-panel="books" aria-expanded="false" aria-controls="home-panel">Books</button>
                            <button type="button" id="home-social-toggle" aria-expanded="false" aria-controls="home-social">Social</button>
                        </nav>
                        <div class="home-social" id="home-social"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="home-panel" id="home-panel" hidden>
        <div class="home-panel-backdrop" data-close-panel></div>
        <div class="home-panel-sheet" id="home-panel-sheet" role="dialog" aria-modal="true">
            <div class="home-panel-bar">
                <button type="button" class="home-panel-back" data-panel-back hidden>Back</button>
                <button type="button" class="home-panel-close" data-close-panel>Close</button>
            </div>
            <div class="home-panel-view" id="home-panel-books" hidden>
                <div class="page-intro">
                    <h2 id="home-panel-books-title">Books</h2>
                    <div class="trilogy-blurb" id="trilogy-blurb"></div>
                </div>
                <div class="books-grid" id="books-grid"></div>
            </div>
            <div class="home-panel-view" id="home-panel-book" hidden>
                <div class="book-content">
                    <div class="book-cover" id="panel-book-cover-wrap">
                        <img id="panel-book-cover" alt="">
                    </div>
                    <div class="book-details">
                        <h2 id="home-panel-book-title"></h2>
                        <p class="book-year" id="panel-book-year"></p>
                        <div class="book-summary" id="panel-book-summary"></div>
                        <a href="#" id="panel-book-pdf" class="pdf-link" target="_blank" rel="noopener">Read PDF</a>
                    </div>
                </div>
            </div>
            <div class="home-panel-view" id="home-panel-predictions" hidden>
                <div class="page-intro">
                    <h2 id="home-panel-predictions-title">Predictions</h2>
                    <div class="predictions-blurb" id="predictions-blurb"></div>
                </div>
                <div class="predictions-grid" id="predictions-grid"></div>
            </div>
        </div>
    </div>
    <script src="js/content.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
