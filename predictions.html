<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictions - Damien Lefebvre</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <style>
        .page-intro {
            max-width: 36rem;
            margin: 0 0 3.5rem;
            animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .page-intro h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .predictions-blurb p {
            font-size: 1.05rem;
            line-height: 1.75;
            color: var(--text-secondary);
        }

        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 280px));
            gap: 2.5rem 2rem;
            margin-bottom: 2rem;
            animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        .prediction {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .prediction-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(160deg, var(--coming-soon-color-1) 0%, var(--coming-soon-color-2) 100%);
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .prediction:hover .prediction-cover {
            transform: translateY(-4px);
        }

        .prediction-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .coming-soon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .prediction-info {
            text-align: left;
        }

        .prediction-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .prediction-year {
            font-size: 0.8rem;
            color: var(--text-quaternary);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        @media (max-width: 600px) {
            .predictions-grid {
                grid-template-columns: 1fr 1fr;
                gap: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div class="container">
        <section>
            <div class="page-intro">
                <h1>Predictions</h1>
                <div class="predictions-blurb" id="predictions-blurb"></div>
            </div>
            <div class="predictions-grid" id="predictions-grid"></div>
        </section>

        <footer>
            <div id="footer-social-placeholder"></div>
            <p>&copy; <span id="copyright-year"></span></p>
        </footer>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/background-interactive.js"></script>
    <script src="js/header-content.js"></script>
    <script src="js/load-header.js"></script>
    <script src="js/content.js"></script>
    <script src="js/load-content.js"></script>
    <script src="js/load-footer.js"></script>
    <script>
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
