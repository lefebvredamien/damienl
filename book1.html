<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book - Damien Lefebvre</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/book.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div class="container">
        <a href="books.html" class="back-link">← Back to Books</a>

        <div class="book-content">
            <div class="book-cover">
                <img data-content="book-cover" data-book-id="" alt="" onerror="this.style.display='none';">
            </div>

            <div class="book-details">
                <h1 data-content="book-title" data-book-id=""></h1>
                <p class="book-year" data-content="book-year" data-book-id=""></p>
                <div class="book-summary" data-content="book-summary" data-book-id=""></div>
                <a href="#" data-content="pdf-link" data-book-id="" target="_blank" class="pdf-link">Read PDF</a>
            </div>
        </div>

        <footer>
            <div id="footer-social-placeholder"></div>
            <p>&copy; <span id="copyright-year"></span></p>
        </footer>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/background-interactive.js"></script>
    <script src="js/header-content.js"></script>
    <script src="js/load-header.js"></script>
    <script src="js/content.js"></script>
    <script src="js/load-content.js"></script>
    <script src="js/load-footer.js"></script>
    <script>
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
